metadata:
  namespace: hot-crm
  labels:
    team: hot-crm
spec:
  ingresses:
     - "https://sf-pubsub-plis.intern.dev.nav.no"  # For å visuelt se whitelist-effekten i browser under /gui
  env:
     - name: KAFKA_TOPIC
       value: 'teamcrm.message'  # Fullt navn på Kafka-topic: <namespace>.<topic-name>
     - name: SALESFORCE_TOPIC
       value: 'event/HOT_LOS_PaymentClaim__e'  # Navn på Salesforce Topic