apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: payment-claim
  namespace: hot-crm
  labels:
    team: hot-crm
  annotations:
    kafka.nais.io/removeDataWhenResourceIsDeleted: "true"
spec:
  pool: nav-dev
  config:
    cleanupPolicy: delete
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 3
    retentionBytes: -1
    retentionHours: 720 #30 days
  acl:
    - team: hot-crm
      application: sf-pubsub-payment-claim
      access: readwrite
    - team: hot-crm
      application: sf-payment-claim
      access: read
    - team: oksty 
      application: tolketjenester 
      access: read
    - team: oksty
      application: oksty-kafka-manager
      access: read
    - team: hot-crm
      application: hot-crm-kafka-manager
      access: read