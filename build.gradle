plugins {
    id 'application'
    id 'java'

    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'org.jmailen.kotlinter' version '5.7.0'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'com.google.protobuf' version '0.10.1'
}

group 'no.nav.sf.pubsub'
version '0.0.1'

jar {
    manifest {
        attributes 'Main-Class': 'no.nav.sf.pubsub.BootstrapKt'
    }
}

shadowJar {
    archiveBaseName = 'app'
    archiveClassifier = ''
    mergeServiceFiles()
}

application {
    mainClass = 'no.nav.sf.pubsub.BootstrapKt'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://packages.confluent.io/maven"
    }
}

dependencies {
    implementation platform('io.netty:netty-bom:4.2.20.Final')

    implementation 'com.google.protobuf:protobuf-java:4.36.2'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'  // Add this for @Generated annotation
    implementation 'io.grpc:grpc-core:1.85.1'
    implementation 'io.grpc:grpc-api:1.85.1'
    implementation "com.google.guava:guava:33.8.0-jre" // Transitive dependency for io.grpc:grpc-api:1.85.1
    implementation 'io.grpc:grpc-netty:1.85.1'
    implementation 'io.grpc:grpc-protobuf:1.85.1'
    implementation 'io.grpc:grpc-stub:1.85.1'
    implementation 'io.grpc:grpc-auth:1.85.1'

    implementation 'io.lettuce:lettuce-core:7.9.0.RELEASE'


    implementation "org.apache.kafka:kafka-clients:4.4.0"



    implementation "org.xerial.snappy:snappy-java:1.1.10.12" // Transitive dependency for org.apache.kafka:kafka-clients:4.4.0
    implementation "at.yawk.lz4:lz4-java:1.13.0" // Transitive dependency for org.apache.kafka:kafka-clients:4.3.0
    //implementation "at.yawk.lz4:lz4-java:1.11.1" // Transitive to kafka-clients:4.1.2

    // Avro core library
    implementation 'org.apache.avro:avro:1.12.2'

    implementation "com.fasterxml.jackson.core:jackson-databind:2.22.4" // Transitive dependency for org.apache.avro:avro:1.12.2
    implementation 'org.yaml:snakeyaml:2.7'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"

    implementation 'com.google.code.gson:gson:2.15.0'

    implementation "org.http4k:http4k-core:6.61.0.0"
    implementation "org.http4k:http4k-server-netty:6.61.0.0"
    implementation "org.http4k:http4k-client-okhttp:6.61.0.0"

    implementation "io.github.microutils:kotlin-logging:3.0.5"
    implementation "ch.qos.logback:logback-classic:1.6.6"
    implementation "net.logstash.logback:logstash-logback-encoder:9.0"
    implementation "tools.jackson.core:jackson-databind:3.2.4" // Transitive dependency for net.logstash.logback:logstash-logback-encoder:9.0

    implementation "io.prometheus:simpleclient_common:0.9.0"
    implementation "io.prometheus:simpleclient_hotspot:0.9.0"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    kotlinOptions.jvmTarget = "21"
    dependsOn("mergeYamlTask")
}

tasks.withType(JavaCompile) {
    sourceCompatibility = "21"
    targetCompatibility = "21"
}

tasks.named("compileKotlin") {
    dependsOn("generateProto")
}

// Add protobuf plugin configuration
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.3"  // Specify protoc version
    }

    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.83.1"  // gRPC plugin
        }
    }

    generateProtoTasks {
        all().forEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/java',
                    'build/generated/source/proto/main/grpc'
        }
        kotlin {
            srcDirs 'src/main/kotlin'  // Add Kotlin source directory here
        }
    }
    test {
        kotlin {
            srcDirs 'src/test/kotlin'
        }
    }
}

apply from: 'mergeYamlTask.gradle'